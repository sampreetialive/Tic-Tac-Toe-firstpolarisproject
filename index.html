<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Tic Tac Toe</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background-glow"></div>


<main class="container">


<header>

<h1>
TIC TAC TOE
</h1>

<p id="status">
Player X's Turn
</p>

</header>





<section class="scoreboard">


<div class="score-card">

<span>X</span>

<strong id="x-score">0</strong>

</div>



<div class="score-card">

<span>DRAW</span>

<strong id="draw-score">0</strong>

</div>



<div class="score-card">

<span>O</span>

<strong id="o-score">0</strong>

</div>


</section>







<section class="board">


<div class="cell" data-index="0"></div>

<div class="cell" data-index="1"></div>

<div class="cell" data-index="2"></div>



<div class="cell" data-index="3"></div>

<div class="cell" data-index="4"></div>

<div class="cell" data-index="5"></div>



<div class="cell" data-index="6"></div>

<div class="cell" data-index="7"></div>

<div class="cell" data-index="8"></div>



<div class="winning-line"></div>


</section>







<button id="restart">

NEW GAME

</button>



</main>









<!-- AUDIO -->


<audio id="clickSound" preload="auto" controls hidden>

<source src="neon-click.mp3" type="audio/mpeg">

</audio>




<audio id="winSound" preload="auto" controls hidden>

<source src="victory.mp3" type="audio/mpeg">

</audio>


<audio id="drawSound" preload="auto" controls hidden>

<source src="draw-effect.mp3" type="audio/mpeg">

</audio>









<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


<script src="script.js"></script>


</body>


</html>
